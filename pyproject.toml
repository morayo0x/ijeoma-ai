[project]
name = "ijeoma-ai"
version = "0.3.0"
description = "Grounded West African destination assistant: Gemma 3 1B fine-tuned with LoRA."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long strings in prompts are intentional
    "RUF001",  # en dashes and curly quotes in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["retrieval", "ijeoma_pairs", "ijeoma_build", "ijeoma_teacher", "ijeoma_summarize", "ijeoma_clean", "prompts", "model"]
